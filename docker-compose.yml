# ==============================================================================
# AIOManager Docker Compose Configuration
# ==============================================================================
#
# QUICK START:
#   - Default (SQLite): docker compose up
#   - PostgreSQL: docker compose --profile postgres up
#
# PostgreSQL Setup:
#   1. Set DB_TYPE=postgres in your .env file
#   2. Set DATABASE_URL=postgres://user:pass@aiomanager-db:5432/dbname in .env
#      (or use your external postgres URL)
#   3. Run: docker compose --profile postgres up
#
# The aiomanager-db service is only started with the postgres profile.
# By default, SQLite is used (DB_TYPE=sqlite, DATABASE_URL=).
#
# ==============================================================================

services:
  aiomanager:
    image: ghcr.io/sonicx161/aiomanager:latest
    container_name: aiomanager
    restart: unless-stopped
    ports:
      - "1610:1610"
    env_file:
      - .env
    environment:
      # Use .env values with SQLite as fallback
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - ./aio-data:/app/data
    healthcheck:
      # NOTE: If you use Traefik/Reverse Proxies and see 404s, remove the healthcheck block.
      test: [ "CMD", "/nodejs/bin/node", "server/healthcheck.js" ]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 15s
    profiles:
      - default
      - postgres

  # --- Internal PostgreSQL Service (requires --profile postgres) ---
  aiomanager-db:
    image: postgres:16-alpine
    container_name: aiomanager_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aio_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aio_password}
      - POSTGRES_DB=${POSTGRES_DB:-aio_manager}
    volumes:
      - ./aio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aio_user} -d $${POSTGRES_DB:-aio_manager}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres
